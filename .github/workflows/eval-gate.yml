name: RAG Eval Gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate deterministic lab artifacts
        run: python scripts/generate_lab24_artifacts.py --offline
      - name: Run RAGAS evaluation gate
        run: |
          python scripts/run_eval.py \
            --threshold faithfulness=0.70 \
            --threshold answer_relevancy=0.70 \
            --threshold context_precision=0.55 \
            --threshold context_recall=0.55
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: |
            phase-a/ragas_results.csv
            phase-a/ragas_summary.json
